# Comprehensive experiment matrix configuration file.
# The experiment runner (Milestone 8) expands `matrix` axes into Cartesian product combinations.

experiment:
  name: medical-rag-benchmark-sweep
  dataset: pubmedqa            # pubmedqa (IR & Quality metrics) | medqa
  seed: 42

matrix:
  vectorstore: [qdrant, weaviate]
  embedding_model:
    - BAAI/bge-large-en-v1.5
    - amazon.titan-embed-text-v2:0
  chunking:
    - { strategy: recursive, chunk_size: 300, chunk_overlap: 30 }
    - { strategy: recursive, chunk_size: 512, chunk_overlap: 64 }
    - { strategy: semantic }
  retrieval:
    - { strategy: dense, top_k: 10 }
    - { strategy: hybrid, top_k: 20, alpha: 0.5 }
  orchestration: [linear, agentic]

metrics:
  retrieval: [precision@5, recall@10, mrr, map, ndcg@10, hit_rate]
  answer: [faithfulness, answer_relevance, context_precision, context_recall]
  systems: [index_build_s, query_latency_ms, rerank_latency_ms, tokens, cost_usd, peak_memory_mb]
