name: Medical RAG Evaluation Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test-gates:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
          - 6334:6334
      mlflow:
        image: ghcr.io/mlflow/mlflow:v2.17.2
        ports:
          - 5000:5000
        cmd: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov bandit hatchling
          pip install -e .

      - name: 1. Code Quality Gate (Ruff Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      - name: 2. Static Type Check Gate (Mypy)
        run: |
          mypy src/

      - name: 3. Security Vulnerability Audit Gate (Bandit)
        run: |
          bandit -r src/ -x tests/

      - name: 4. Automated Unit & Integration Tests (Pytest)
        env:
          ENV: test
          QDRANT_URL: http://localhost:6333
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          pytest --cov=src/rag_eval --cov-report=term-missing tests/

      - name: 5. Container Image Build Verification
        run: |
          docker build -t rag-eval:ci .
